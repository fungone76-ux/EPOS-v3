[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epos-v3"
version = "3.1.0"
description = "Generic AI-assisted narrative RPG engine with authoritative Python state"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0,<3",
  "httpx>=0.27",
  "aiofiles>=23.2",
  "PyYAML>=6.0",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "websockets>=12",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
ai-memory = [
  "chromadb>=0.5",
  "sentence-transformers>=3.0",
]
logging = ["structlog>=24.0"]
gui = ["PySide6>=6.7"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "mypy>=1.10",
]

[project.scripts]
epos = "epos_v3.presentation.cli:main_sync"
epos-gui = "epos_v3.presentation.gui_app:main_sync"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["epos_v3"]
