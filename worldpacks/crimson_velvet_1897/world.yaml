schema_version: 1
id: crimson_velvet_1897
world_id: crimson_velvet_1897
title: The Crimson Velvet — 1897
premise: Nel 1897 un ricchissimo viaggiatore arriva sulla Riviera ligure al Crimson Velvet, hotel-casino ricavato da una villa aristocratica. Dietro feste, camere private e saloni dorati si nascondono un titolo di proprietà contestato, lettere compromettenti, traffici d'arte e quattro donne adulte con obiettivi incompatibili.
start_time_phase: sera
start_location_id: loc_grand_hall
interactive_creation: true
open_end: true
riserva_dice: 0
opening_narration: Una carrozza nera si ferma sotto la pensilina del Crimson Velvet. Il mare è scuro, il salone brilla di lampade a gas e Victoria Hale attende il nuovo ospite davanti alla grande scalinata.
skill_definitions:
  fascino: Presenza sociale, seduzione, etichetta e persuasione personale.
  intuito: Lettura di persone, menzogne, dettagli e tensioni nascoste.
  autorita: Comando, status, pressione sociale e capacità di imporre ordine.
  negoziazione: Contratti, denaro, concessioni e accordi.
  audacia: Rischio fisico, iniziativa, sangue freddo e azioni fuori protocollo.
