schema_version: 1
world_id: crimson_velvet_1897
missions:
  - id: mission_crimson_arrival
    reveal: initial
    success_points: 0
    failure_points: 0
    required_flags: [resort_intro_completed]
    complete_when_required_flags: true
    completion_flag: crimson_arrival_complete
    terminal_failure_flags: []
    intro_steps:
      - id: player_intro
        kind: player_intro
        target_npc_id: ""
        narration: La carrozza si ferma sotto la pensilina del Crimson Velvet. Nel Grand Hall, Victoria Hale attende accanto alla scalinata mentre un domestico prende il cappotto del nuovo ospite.
        dialogue: "Victoria: Benvenuto al Crimson Velvet. Prima delle formalità, preferisco sapere direttamente da lei chi sto accogliendo questa sera."
        action_id: idle_neutral
      - id: victoria
        kind: npc_intro
        target_npc_id: victoria
        narration: Victoria ascolta la presentazione senza interrompere, poi si presenta come proprietaria e direttrice del Crimson Velvet. Precisa che la casa vive di discrezione, reputazione e accordi mantenuti.
        dialogue: "Victoria: Victoria Hale. Questa casa è mia responsabilità. Se resterà abbastanza a lungo, scoprirà che qui il lusso è la parte più semplice da amministrare."
        action_id: speaking_gesture
      - id: luna
        kind: npc_intro
        target_npc_id: luna
        narration: Victoria introduce Luna come la persona che conosce meglio il tratto di costa, i fornitori e tutto ciò che arriva al Crimson Velvet senza passare dalla porta principale.
        dialogue: "Luna: Conosco sentieri, barche e persone. Se vuole vedere la Riviera che non compare sulle cartoline, chieda a me."
        action_id: speaking_gesture
      - id: maria
        kind: npc_intro
        target_npc_id: maria
        narration: Maria viene presentata come responsabile della casa, della corrispondenza riservata e degli archivi privati. Il suo tono è discreto, quasi notarile.
        dialogue: "Maria: Mi occupo di ciò che deve arrivare alla persona giusta e di ciò che non deve finire nelle mani sbagliate. La sua suite è pronta."
        action_id: speaking_gesture
      - id: stella
        kind: npc_intro
        target_npc_id: stella
        narration: Per ultima arriva Stella dal teatro privato, ancora avvolta nell'energia delle prove. Victoria la presenta come la voce e il volto pubblico delle serate del Crimson Velvet.
        dialogue: "Stella: Io mi occupo della parte che tutti ricordano. Musica, spettacoli, scandali evitabili e qualche scandalo che vale la pena correre."
        action_id: speaking_gesture

  - id: mission_crimson_fate
