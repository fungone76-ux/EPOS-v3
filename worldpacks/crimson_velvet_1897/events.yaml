schema_version: 1
world_id: crimson_velvet_1897
events:
  - id: event_victoria_title_copy
    title: La copia nella cassaforte
    summary: "Victoria mostra una copia incompleta dell'atto che potrebbe invalidare la proprietà del Crimson Velvet."
    player_hook: "Puoi esaminarla, chiedere chi l'ha alterata, offrire aiuto legale o rifiutare di essere coinvolto."
    day_range: [1, 9999]
    phases: [pomeriggio, sera, notte]
    location_id: loc_victoria_office
    npc_ids: [victoria]
    trigger: {mission_active: mission_victoria_house}
    adult_component: private_tension_and_trust
    consent_exit_required: true
    choices: [examine_copy, ask_about_forgery, offer_legal_help, refuse_involvement]
    completion_flag: victoria_copy_examined

  - id: event_archive_broken_seal
    title: Il sigillo spezzato
    summary: "Maria trova una cassa d'archivio aperta e il posto vuoto del registro notarile originale."
    player_hook: "Puoi aiutarla a inventariare, cercare indizi, interrogare il personale o lasciare tutto intatto."
    day_range: [1, 9999]
    phases: [mattina, pomeriggio, notte]
    location_id: loc_archive
    npc_ids: [maria]
    trigger: {flag: resort_intro_completed, expected: true}
    adult_component: close_private_investigation
    consent_exit_required: true
    choices: [inventory_with_maria, inspect_room, question_staff, preserve_scene]
    completion_flag: title_dispute_discovered

  - id: event_maria_inventory
    title: Inventario a porte chiuse
    summary: "Maria propone di ricostruire insieme ciò che manca dall'archivio e ciò che è stato spostato."
    player_hook: "Puoi lavorare con lei, delegare, concentrarti sulle lettere private o cercare solo il registro."
    day_range: [1, 9999]
    phases: [pomeriggio, sera, notte]
    location_id: loc_archive
    npc_ids: [maria]
    trigger: {mission_active: mission_maria_letters}
    adult_component: prolonged_private_closeness
    consent_exit_required: true
    choices: [work_together, delegate, examine_letters, focus_register]
    completion_flag: maria_archive_inventory_complete

  - id: event_stella_rehearsal
    title: Prova generale senza pubblico
    summary: "Stella invita il protagonista nel teatro vuoto per provare il numero destinato agli impresari europei."
    player_hook: "Puoi darle feedback, provocarla artisticamente, suggerire un numero più audace o osservare."
    day_range: [1, 9999]
    phases: [pomeriggio, sera]
    location_id: loc_theatre
    npc_ids: [stella]
    trigger: {mission_active: mission_stella_stage}
    adult_component: sensual_stage_performance
    consent_exit_required: true
    choices: [support_rehearsal, challenge_artistically, suggest_bolder_number, observe_only]
    completion_flag: stella_rehearsal_supported

  - id: event_casino_high_table
    title: Il tavolo dei cento luigi
    summary: "Un banchiere, un impresario e un giornalista giocano una fortuna mentre Victoria studia il tavolo."
    player_hook: "Puoi sederti, osservare, usare il tuo status per ottenere informazioni o lasciare agire Victoria."
    day_range: [1, 9999]
    phases: [sera, notte]
    location_id: loc_casino
    npc_ids: [victoria, stella]
    trigger: {flag: resort_intro_completed, expected: true}
    adult_component: decadent_high_society
    consent_exit_required: true
    choices: [join_table, observe_players, pressure_with_status, defer_to_victoria]
    completion_flag: creditor_circle_identified

  - id: event_stella_critic_letter
    title: La lettera del critico
    summary: "Stella rivela che un critico parigino conserva una sua lettera privata e minaccia di usarla contro di lei."
    player_hook: "Puoi negoziare, comprare la lettera senza condizioni, smascherare il ricatto o rispettare la scelta di Stella."
    day_range: [1, 9999]
    phases: [sera, notte]
    location_id: loc_winter_garden
    npc_ids: [stella]
    trigger: {flag: stella_rehearsal_supported, expected: true}
    adult_component: intimate_confession_and_reputation
    consent_exit_required: true
    choices: [negotiate_return, buy_without_conditions, expose_blackmail, respect_stella_choice]
    completion_flag: stella_critic_letter_resolved

  - id: event_luna_hidden_stairs
    title: La scala dietro il muro
    summary: "Luna mostra un accesso nascosto dai corridoi di servizio al sentiero della scogliera."
    player_hook: "Puoi seguirla, segnare il percorso, chiedere chi lo usa o tornare indietro."
    day_range: [1, 9999]
    phases: [pomeriggio, sera, notte]
    location_id: loc_service_corridor
    npc_ids: [luna]
    trigger: {mission_active: mission_luna_smugglers}
    adult_component: secretive_private_excursion
    consent_exit_required: true
    choices: [follow_luna, map_route, ask_names, turn_back]
    completion_flag: luna_hidden_route_revealed

  - id: event_cove_lanterns
    title: Tre lanterne nella cala
    summary: "Luna riconosce il segnale di una barca clandestina e una cassa con il vecchio sigillo del Crimson Velvet."
    player_hook: "Puoi osservare, avvicinarti con Luna, creare un diversivo o chiamare le autorità."
    day_range: [1, 9999]
    phases: [notte]
    location_id: loc_private_cove
    npc_ids: [luna]
    trigger: {flag: luna_hidden_route_revealed, expected: true}
    adult_component: dangerous_night_closeness
    consent_exit_required: true
    choices: [observe_exchange, approach_with_luna, create_diversion, call_authorities]
    completion_flag: luna_cove_network_identified

  - id: event_register_exchange
    title: Il registro nella cassa del quadro
    summary: "Il registro mancante è nascosto sotto la tela di un dipinto destinato a lasciare l'Italia clandestinamente."
    player_hook: "Puoi recuperare il registro, sequestrare la cassa, lasciare una copia falsa o seguire il compratore."
    day_range: [1, 9999]
    phases: [sera, notte]
    location_id: loc_private_cove
    npc_ids: [luna]
    trigger: {flag: luna_cove_network_identified, expected: true}
    adult_component: high_risk_shared_secret
    consent_exit_required: true
    choices: [take_register, take_everything, plant_false_copy, follow_buyer]
    completion_flag: missing_register_recovered

  - id: event_maria_creditor_letter
    title: La lettera che cambia il debito
    summary: "Maria trova una lettera autentica che collega uno dei principali creditori alla frode originale."
    player_hook: "Puoi conservarla come prova, offrirla a Victoria, restituirla alla famiglia coinvolta o distruggerla."
    day_range: [1, 9999]
    phases: [pomeriggio, sera, notte]
    location_id: loc_archive
    npc_ids: [maria]
    trigger: {flag: missing_register_recovered, expected: true}
    adult_component: confidential_moral_intimacy
    consent_exit_required: true
    choices: [keep_as_evidence, give_to_victoria, return_to_family, destroy_letter]
    completion_flag: maria_creditor_letter_revealed

  - id: event_letters_judgement
    title: Cosa merita di sopravvivere
    summary: "Maria chiede di decidere il destino di lettere capaci di distruggere reputazioni senza aiutare la causa legale."
    player_hook: "Puoi sigillarle, restituirle, distruggerle o conservarle come leva politica."
    day_range: [1, 9999]
    phases: [sera, notte]
    location_id: loc_archive
    npc_ids: [maria]
    trigger: {flag: maria_creditor_letter_revealed, expected: true}
    adult_component: private_ethics_and_trust
    consent_exit_required: true
    choices: [seal_letters, return_letters, destroy_letters, keep_as_leverage]
    completion_flag: maria_letters_fate_decided

  - id: event_stella_contract
    title: Parigi o il Crimson Velvet
    summary: "Un impresario offre a Stella una tournée europea con una clausola che la legherebbe per anni."
    player_hook: "Puoi finanziare un contratto indipendente, negoziare, consigliarla o lasciarle piena libertà."
    day_range: [1, 9999]
    phases: [pomeriggio, sera]
    location_id: loc_theatre
    npc_ids: [stella]
    trigger: {flag: stella_critic_letter_resolved, expected: true}
    adult_component: ambition_desire_and_independence
    consent_exit_required: true
    choices: [fund_independent_tour, negotiate_clause, advise_signing, let_stella_decide]
    completion_flag: stella_europe_contract_decided

  - id: event_victoria_terms
    title: Contratto dopo mezzanotte
    summary: "Victoria discute in privato le forme possibili di proprietà: acquisto, società, trust o difesa legale."
    player_hook: "Puoi proporre una partnership, un acquisto, un prestito, un trust o nessun accordo economico."
    day_range: [1, 9999]
    phases: [notte]
    location_id: loc_victoria_office
    npc_ids: [victoria]
    trigger: {flag: missing_register_recovered, expected: true}
    adult_component: charged_private_negotiation
    consent_exit_required: true
    choices: [propose_partnership, propose_purchase, offer_loan, propose_trust, no_financial_deal]
    completion_flag: victoria_private_terms_discussed

  - id: event_victoria_autonomy
    title: Il prezzo che Victoria non accetta
    summary: "Victoria chiarisce che la casa può essere negoziata, la sua autonomia no."
    player_hook: "Puoi separare affari e relazione, chiedere un legame personale, restare partner d'affari o chiudere la trattativa."
    day_range: [1, 9999]
    phases: [sera, notte]
    location_id: loc_winter_garden
    npc_ids: [victoria]
    trigger: {flag: victoria_private_terms_discussed, expected: true}
    adult_component: explicit_boundaries_and_attraction
    consent_exit_required: true
    choices: [separate_business_and_desire, ask_personal_relationship, business_only, end_talk]
    completion_flag: victoria_autonomy_choice_respected

  - id: event_luna_fishermen
    title: I nomi che Luna non consegnerà
    summary: "Luna distingue i contrabbandieri professionisti dai pescatori coinvolti per debiti o paura."
    player_hook: "Puoi proteggere i pescatori, denunciarli tutti, creare un accordo di immunità o lasciare decidere Luna."
    day_range: [1, 9999]
    phases: [mattina, pomeriggio, sera]
    location_id: loc_cliff_path
    npc_ids: [luna]
    trigger: {flag: missing_register_recovered, expected: true}
    adult_component: trust_under_pressure
    consent_exit_required: true
    choices: [protect_fishermen, report_everyone, negotiate_immunity, let_luna_decide]
    completion_flag: luna_fishermen_choice_respected

  - id: event_maria_authority
    title: Le chiavi dell'archivio
    summary: "Maria chiede un riconoscimento formale: non più domestica fidata, ma amministratrice dell'archivio."
    player_hook: "Puoi sostenerla, proporre un ruolo più ampio, restare neutrale o contestare la richiesta."
    day_range: [1, 9999]
    phases: [pomeriggio, sera]
    location_id: loc_victoria_office
    npc_ids: [maria, victoria]
    trigger: {flag: maria_letters_fate_decided, expected: true}
    adult_component: status_and_personal_recognition
    consent_exit_required: true
    choices: [support_maria, expand_role, stay_neutral, oppose_request]
    completion_flag: maria_authority_recognized

  - id: event_stella_private_choice
    title: Dopo l'ultimo applauso
    summary: "Stella chiarisce cosa desidera separatamente da carriera, contratto e pubblico."
    player_hook: "Puoi ascoltare, ricambiare l'attrazione, rallentare o mantenere il rapporto professionale."
    day_range: [1, 9999]
    phases: [notte]
    location_id: loc_theatre
    npc_ids: [stella]
    trigger: {flag: stella_europe_contract_decided, expected: true}
    adult_component: voluntary_private_desire
    consent_exit_required: true
    choices: [listen_closely, reciprocate_attraction, slow_down, remain_professional]
    completion_flag: stella_private_choice_complete

  - id: event_creditor_resolution
    title: Il creditore senza maschera
    summary: "Le prove permettono di affrontare il creditore collegato alla frode originale."
    player_hook: "Puoi denunciarlo, costringerlo a rinunciare al credito, negoziare una restituzione o renderlo testimone."
    day_range: [1, 9999]
    phases: [sera, notte]
    location_id: loc_casino
    npc_ids: [victoria, maria]
    trigger: {flag: maria_creditor_letter_revealed, expected: true}
    adult_component: power_and_consequence
    consent_exit_required: true
    choices: [expose_creditor, cancel_debt, negotiate_restitution, turn_witness]
    completion_flag: creditor_connection_resolved

  - id: event_crimson_judgement
    title: Chi deve possedere il Crimson Velvet
    summary: "Registro e lettera rendono possibile una decisione definitiva sul futuro legale della casa."
    player_hook: "Puoi sostenere Victoria, acquistare equamente, creare un trust, restituire quote agli eredi o andare in tribunale."
    day_range: [1, 9999]
    phases: [pomeriggio, sera, notte]
    location_id: loc_grand_hall
    npc_ids: [victoria, stella, maria, luna]
    trigger: {flag: creditor_connection_resolved, expected: true}
    adult_component: public_power_private_consequences
    consent_exit_required: true
    choices: [back_victoria, fair_purchase, independent_trust, restore_heir_shares, go_to_court]
    completion_flag: crimson_ownership_decision

  - id: event_victoria_bond
    title: Victoria senza contratto sul tavolo
    summary: "Risolto il destino della casa, Victoria propone un incontro privato senza condizioni economiche."
    player_hook: "Puoi accettare, rallentare, ridefinire i limiti o restare alleati."
    day_range: [1, 9999]
    phases: [sera, notte]
    location_id: loc_presidential_suite
    npc_ids: [victoria]
    trigger: {flag: victoria_intimate_milestone_unlocked, expected: true}
    adult_component: consensual_private_milestone
    consent_exit_required: true
    choices: [accept_victoria, slow_down, redefine_boundaries, allies_only]
    completion_flag: victoria_bond_complete

  - id: event_stella_bond
    title: Stella dopo il sipario
    summary: "Stella può trasformare l'attrazione in un incontro adulto privato scelto per sé stessa."
    player_hook: "Puoi accettare, scegliere un altro momento, rallentare o restare amici."
    day_range: [1, 9999]
    phases: [notte]
    location_id: loc_theatre
    npc_ids: [stella]
    trigger: {flag: stella_intimate_milestone_unlocked, expected: true}
    adult_component: consensual_private_milestone
    consent_exit_required: true
    choices: [accept_stella, choose_later, slow_down, friends_only]
    completion_flag: stella_bond_complete

  - id: event_maria_bond
    title: Maria chiude l'archivio
    summary: "Maria sceglie se aprire uno spazio personale e adulto con il protagonista."
    player_hook: "Puoi accettare, chiederle tempo, rallentare o mantenere una relazione di fiducia non romantica."
    day_range: [1, 9999]
    phases: [sera, notte]
    location_id: loc_presidential_suite
    npc_ids: [maria]
    trigger: {flag: maria_intimate_milestone_unlocked, expected: true}
    adult_component: consensual_private_milestone
    consent_exit_required: true
    choices: [accept_maria, ask_time, slow_down, trusted_allies]
    completion_flag: maria_bond_complete

  - id: event_luna_bond
    title: Luna resta per scelta
    summary: "Dopo la crisi della cala, Luna decide se il protagonista fa parte della vita che vuole scegliere."
    player_hook: "Puoi ricambiare, lasciarle piena libertà, rallentare o restare compagni d'avventura."
    day_range: [1, 9999]
    phases: [sera, notte]
    location_id: loc_private_cove
    npc_ids: [luna]
    trigger: {flag: luna_intimate_milestone_unlocked, expected: true}
    adult_component: consensual_private_milestone
    consent_exit_required: true
    choices: [reciprocate_luna, give_freedom, slow_down, companions_only]
    completion_flag: luna_bond_complete

  - id: event_crimson_epilogue
    title: Il Crimson Velvet dopo la verità
    summary: "Il destino della casa e i quattro legami sono risolti; la campagna può chiudersi o continuare in freeplay."
    player_hook: "Puoi concludere formalmente la campagna o continuare."
    day_range: [1, 9999]
    phases: [mattina, pomeriggio, sera, notte]
    location_id: loc_grand_hall
    npc_ids: [victoria, stella, maria, luna]
    trigger: {flag: campaign_complete, expected: true}
    adult_component: established_adult_relationships
    consent_exit_required: true
    choices: [finish_campaign, continue_freeplay]
