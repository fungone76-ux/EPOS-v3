  feet: [full_body, low_full_body]
  outfit: [full_body, medium_full, mirror_shot]
  full_body: [full_body, low_full_body, mirror_shot]
  interaction: [medium_eye_level, medium_full, over_shoulder]
  intimate: [extreme_close_up, close_up_breasts, close_up_hips, close_up_buttocks, between_legs]
  voyeur: [voyeur_peek, shower_glass, high_angle_looking_down]

framing_rules:
  face:
    positive: [face clearly visible]
    negative: [face out of frame, obscured face]
  eyes:
    positive: [eyes unobstructed]
    negative: [obscured eyes]
  hands:
    positive: [both hands clearly visible]
    negative: [cropped hands, hands out of frame]
  chest:
    positive: [upper torso clearly visible]
    negative: [upper torso cropped]
  back:
    positive: [back clearly visible, rear body emphasis]
    negative: [back obscured]
  hips:
    positive: [hips clearly visible, hip emphasis]
    negative: [hips cropped]
  buttocks:
    positive: [lower body clearly visible, rear lower-body emphasis]
    negative: [lower body cropped, rear view obscured]
  legs:
    positive: [legs clearly visible, include legs fully in frame]
    negative: [legs out of frame, cropped legs]
  feet:
    positive: [both feet fully in frame, feet clearly visible]
    negative: [cropped feet, feet out of frame, malformed feet, extra toes, missing toes]
  outfit:
    positive: [full outfit clearly visible]
    negative: [cropped outfit]
  full_body:
    positive: [full body in frame]
    negative: [cropped body]
  interaction:
    positive: [interaction clearly framed]
    negative: []
  intimate:
    positive: [intimate area clearly framed, no obstruction]
    negative: [intimate area cropped, intimate area obscured]
