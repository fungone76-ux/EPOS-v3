  kneeling_forward:
    label: Kneeling forward
    aliases: [kneeling forward, inginocchiata in avanti, a carponi]
    tags: [kneeling, torso leaning forward, hands on ground or bed, buttocks elevated, back arched]
    body_regions_visible: [back, hips, buttocks, chest, face]

  crouching:
    label: Crouching
    aliases: [crouching, accovacciata]
    tags: [crouching, knees bent]
    body_regions_visible: [hands, hips, legs]

  crawling_on_all_fours:
    label: Crawling on all fours
    aliases: [crawling, a gattoni, a carponi, gattoni]
    tags: [on hands and knees, back arched or flat, buttocks highest point, crawling motion, submissive posture]
