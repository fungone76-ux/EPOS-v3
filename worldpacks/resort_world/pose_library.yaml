  # ============================================================
  # WALKING / MOVEMENT
  # ============================================================
  walking_forward:
    label: Walking forward
    aliases: [walking, cammina]
    tags: [walking, natural stride]
    body_regions_visible: [full_body, legs]

  walking_away:
    label: Walking away
    aliases: [walking away, si allontana]
    tags: [walking away, rear view, natural stride]
    body_regions_visible: [back, hips, buttocks, legs]

  walking_swaying_hips:
    label: Walking with swaying hips
    aliases: [swaying hips, cammina con le anche, fianchi che dondolano]
    tags: [walking, exaggerated hip sway, seductive gait, hips rolling side to side, confident stride]
    body_regions_visible: [hips, buttocks, legs, back]

  # ============================================================
  # TRAINING / STRETCH
  # ============================================================
  training_forward_stretch:
    label: Forward training stretch
    aliases: [forward stretch, stretching forward, piegata in avanti]
    tags: [training stretch, torso leaning forward, hips angled toward camera]
    body_regions_visible: [back, hips, buttocks, legs]

  # ============================================================
  # KNEELING / CROUCHING
  # ============================================================
  kneeling_neutral:
    label: Kneeling neutral
    aliases: [kneeling, inginocchiata]
    tags: [kneeling, upright torso]
