  # ============================================================
  # SEATED POSES (originali + nuove)
  # ============================================================
  seated_relaxed:
    label: Seated relaxed
    aliases: [seated, seduta, seated relaxed]
    tags: [seated comfortably, relaxed posture]
    body_regions_visible: [face, chest, hands, hips, legs]

  seated_legs_crossed:
    label: Seated legs crossed
    aliases: [crossed legs, gambe accavallate]
