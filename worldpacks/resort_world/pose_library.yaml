    aliases: [spooning, posizione cucchiaio, sdraiata a cucchiaio]
    tags: [lying on side, knees drawn up, back curved, rear pressed back, intimate side lying]
    body_regions_visible: [back, hips, buttocks, legs]

  # ============================================================
  # EXPLICIT / INTIMATE POSES
  # ============================================================
  legs_spread_wide:
    label: Legs spread wide
    aliases: [legs spread, gambe divaricate, aperto, spread eagle]
    tags: [legs spread very wide, hips fully open, center completely visible, exposed, inviting, no shame]
    body_regions_visible: [hips, legs, face]

  doggy_style:
    label: Doggy style position
    aliases: [doggy, a pecora, a gattoni da dietro, a novanta]
    tags: [on hands and knees, back arched downward, buttocks highest point, face down, rear fully presented, ready position]
