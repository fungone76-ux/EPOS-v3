schema_version: 2
world_id: resort_world
library_type: pose

defaults:
  fallback_pose_id: standing_neutral
  strict_unknown_pose: true

poses:
  # ============================================================
  # STANDING POSES (originali + nuove)
  # ============================================================
  standing_neutral:
    label: Standing neutral
    aliases: [standing, in piedi, standing neutral]
    tags: [standing, balanced stance]
    body_regions_visible: [face, chest, hands, legs]

  standing_one_leg_forward:
    label: One leg forward
    aliases: [one leg forward, una gamba avanti]
    tags: [standing, one leg forward, natural weight shift]
    body_regions_visible: [face, chest, hands, hips, legs]

  standing_hip_shift:
    label: Hip shift
    aliases: [hip shift, peso su un fianco]
    tags: [standing, weight shifted to one hip, asymmetrical stance]
    body_regions_visible: [hips, legs]

  standing_rear_three_quarter:
    label: Rear three-quarter standing
    aliases: [rear three quarter, di tre quarti da dietro]
    tags: [standing, rear three quarter, weight shift]
    body_regions_visible: [back, hips, buttocks, legs]

  standing_against_wall:
    label: Standing against wall
    aliases: [against wall, appoggiata al muro, sul muro]
    tags: [standing against vertical surface, back to wall, one leg bent, relaxed but posed, vulnerable posture]
    body_regions_visible: [face, chest, hips, legs]

  standing_legs_apart:
    label: Standing with legs apart
    aliases: [legs apart, gambe divaricate, in piedi aperto]
    tags: [standing, legs spread shoulder width or more, confident stance, hips open, exposed center]
    body_regions_visible: [hips, legs, face]

  standing_bent_over:
    label: Bent over standing
    aliases: [bent over, piegata in avanti, chinata, a novanta]
    tags: [bent at waist, back horizontal, hands on knees or surface, buttocks elevated and prominent, rear presentation]
    body_regions_visible: [back, hips, buttocks, legs]

  standing_hand_on_hip:
    label: Hand on hip
    aliases: [hand on hip, mano su fianco, posa sicura]
    tags: [standing, one hand on hip, confident posture, waist emphasized, hip cocked]
    body_regions_visible: [face, chest, hips, legs]

  # ============================================================
  # LEANING POSES
  # ============================================================
  leaning_surface:
    label: Leaning on surface
    aliases: [leaning, appoggiata]
    tags: [leaning against nearby surface, relaxed posture]
    body_regions_visible: [face, chest, hips, legs]

  leaning_forward_table:
    label: Leaning forward on table
    aliases: [leaning table, appoggiata al tavolo, chinata sul tavolo]
    tags: [bent over surface, forearms on table, back arched downward, cleavage visible, rear pushed back]
