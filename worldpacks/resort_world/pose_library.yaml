    aliases: [cowgirl, cavalcata, sopra, a cavallo]
    tags: [straddling partner, upright torso, hips grinding, hands on partner chest, dominant female posture]
    body_regions_visible: [face, chest, hips, legs]

  reverse_cowgirl:
    label: Reverse cowgirl position
    aliases: [reverse cowgirl, cavalcata inversa, sopra di spalle]
    tags: [straddling partner facing away, back to camera, hips moving, buttocks visible, rear view riding]
    body_regions_visible: [back, hips, buttocks, legs]

  standing_split:
    label: Standing split against wall
    aliases: [standing split, spaccata in piedi, gamba sollevata alta]
    tags: [one leg raised high against wall, extreme flexibility, hips open, center exposed, vertical split]
    body_regions_visible: [hips, legs, face]

  bridge:
    label: Bridge pose
    aliases: [bridge, ponte, arco, schiena a ponte]
    tags: [back arched like bridge, supporting on shoulders and head, pelvis lifted, body bowed upward]
    body_regions_visible: [chest, hips, back, face]

  # ============================================================
  # FOCUS SETS (aggiornati con nuove pose)
  # ============================================================
focus_sets:
  face: [standing_neutral, seated_relaxed, kneeling_neutral]
  eyes: [standing_neutral, seated_relaxed, kneeling_neutral]
  hands: [standing_neutral, seated_relaxed, kneeling_neutral]
  chest: [standing_neutral, seated_relaxed, leaning_forward_table, leaning_back_arch]
  back: [standing_rear_three_quarter, walking_away, training_forward_stretch, lying_on_stomach, crawling_on_all_fours]
  hips: [standing_hip_shift, seated_legs_angled, standing_rear_three_quarter, standing_legs_apart, seated_legs_spread]
  buttocks: [standing_rear_three_quarter, walking_away, training_forward_stretch, lying_on_stomach, crawling_on_all_fours, doggy_style, reverse_cowgirl]
  legs: [standing_one_leg_forward, seated_legs_crossed, seated_legs_angled, standing_legs_apart, standing_split]
  feet: [seated_legs_crossed, seated_one_leg_extended, seated_ankles_crossed, lying_on_stomach_legs_up]
  outfit: [standing_one_leg_forward, standing_neutral, standing_hand_on_hip]
  full_body: [standing_one_leg_forward, walking_forward, standing_legs_apart, crawling_on_all_fours]
  interaction: [standing_neutral, seated_relaxed, leaning_surface, kneeling_forward]

action_compatibility:
  shoe_removal: [seated_one_leg_extended, seated_ankles_crossed]
  drinking: [standing_neutral, seated_relaxed]
  reading: [seated_relaxed, lying_on_stomach, standing_neutral]
  stretching: [standing_neutral, training_forward_stretch]
  arching_back: [standing_neutral, lying_on_back, kneeling_neutral, leaning_surface]
  sliding_hand_down_body: [standing_neutral, seated_relaxed, lying_on_back, lying_on_stomach]
  crossing_legs_slowly: [seated_relaxed, seated_edge_of_bed, seated_legs_crossed]
  looking_up_through_lashes: [kneeling_neutral, seated_relaxed, lying_on_back, crouching]
  removing_garment: [standing_neutral, seated_relaxed, lying_on_back]
  gripping_sheet: [lying_on_back, lying_on_stomach, seated_edge_of_bed]
