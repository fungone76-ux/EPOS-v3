schema_version: 1
world_id: resort_world
missions:
  - id: mission_resort_arrival
    reveal: initial
    success_points: 0
    failure_points: 0
    required_flags: [resort_intro_completed]
    complete_when_required_flags: true
    completion_flag: resort_intro_completed
    terminal_failure_flags: []
    intro_steps:
      - id: player_intro
        kind: player_intro
        target_npc_id: victoria
        action_id: speaking_gesture
        narration: >-
          L'elicottero privato si posa all'Azure Crown. Nella lobby, Victoria Hale ti
          accoglie personalmente e ti concede il tempo di presentarti prima di iniziare
          il soggiorno.
        dialogue: >-
          Victoria inclina appena il capo. «Benvenuto all'Azure Crown. Prima di tutto,
          desidero sapere chi ho il piacere di accogliere.»
      - id: victoria
        kind: npc_intro
        target_npc_id: victoria
        action_id: speaking_gesture
        narration: >-
          Victoria prende formalmente la parola come direttrice del resort. Il suo tono
          e calmo e autorevole: sara il riferimento personale del protagonista e guidera
          le presentazioni delle tre collaboratrici principali.
        dialogue: >-
          «Sono Victoria Hale, direttrice dell'Azure Crown. Durante il soggiorno saro il
          suo riferimento personale. Vorrei presentarle Luna, Maria e Stella, una alla volta.»
      - id: luna
        kind: npc_intro
        target_npc_id: luna
        action_id: speaking_gesture
        narration: >-
          Su invito di Victoria, Luna si presenta con modi misurati e attenti. Si occupa
          degli aspetti piu riservati e discreti dell'assistenza agli ospiti.
        dialogue: >-
          «Piacere, sono Luna. Mi occupo dell'assistenza privata e discreta. Preferisco
          osservare e capire cio che serve davvero, prima di intervenire.»
      - id: maria
        kind: npc_intro
        target_npc_id: maria
        action_id: speaking_gesture
        narration: >-
          Victoria introduce quindi Maria. Composta e professionale, Maria e responsabile
          della suite presidenziale e dei servizi personali durante il soggiorno.
        dialogue: >-
          «Sono Maria. Mi occupero della suite presidenziale e del suo comfort personale.
          Per qualsiasi necessita potra rivolgersi direttamente a me.»
      - id: stella
        kind: npc_intro
        target_npc_id: stella
        action_id: speaking_gesture
        narration: >-
          Per ultima Victoria introduce Stella, vivace e sicura di se. Stella segue gli
          eventi VIP, l'intrattenimento e le esperienze speciali organizzate nel resort.
        dialogue: >-
          «Io sono Stella. Organizzo gli eventi VIP, l'intrattenimento e le esperienze
          speciali dell'Azure Crown. Faro in modo che qui non ci sia spazio per la noia.»

  - id: mission_resort_future
    reveal: progressive
    unlock_when: {flag: resort_intro_completed, expected: true}
    success_points: 25
    failure_points: -15
    required_flags:
      - resort_service_assessed
      - bank_debt_disclosed
      - resort_final_decision
    complete_when_required_flags: true
    completion_flag: resort_future_resolved
    terminal_failure_flags: [negotiations_refused]

  - id: mission_stella_promotion
    reveal: progressive
    unlock_when: {relationship: stella, field: respect, minimum: 1}
    success_points: 10
    failure_points: -5
    required_flags:
      - stella_vip_event_success
      - stella_private_rehearsal_complete
      - stella_positive_review
      - stella_victoria_test_passed
    complete_when_required_flags: true
    completion_flag: stella_intimate_milestone_unlocked
    terminal_failure_flags: [stella_grave_misconduct]

  - id: mission_maria_stability
    reveal: progressive
    unlock_when: {event_completed: event_bath_for_two}
    success_points: 10
    failure_points: -5
    required_flags:
      - maria_bath_service_recovered
      - maria_private_trust_complete
      - maria_service_problem_solved
      - maria_positive_review
    complete_when_required_flags: true
    completion_flag: maria_intimate_milestone_unlocked
    terminal_failure_flags: [maria_grave_negligence]

  - id: mission_luna_letter
    reveal: progressive
    unlock_when: {relationship: luna, field: trust, minimum: 2}
    success_points: 10
    failure_points: -10
    reveal_gates:
      mention: luna_letter_mention_unlocked
      show: luna_letter_reveal_unlocked
      full_truth: luna_letter_truth_unlocked
    required_flags:
      - luna_letter_mentioned
      - luna_letter_revealed
      - luna_letter_author_confirmed
      - luna_promise_answered
      - luna_present_choice_complete
    complete_when_required_flags: true
    completion_flag: luna_intimate_milestone_unlocked
    terminal_failure_flags: [luna_letter_abused]

  - id: mission_victoria_save_resort
    reveal: progressive
    unlock_when: {flag: bank_debt_disclosed, expected: true}
    success_points: 10
    failure_points: -5
    required_flags:
      - victoria_strengths_shown
      - bank_debt_disclosed
      - victoria_team_proven
      - victoria_private_audit_complete
      - resort_saved
    complete_when_required_flags: true
    completion_flag: victoria_intimate_milestone_unlocked
    terminal_failure_flags: [victoria_trust_destroyed]

  - id: mission_four_bonds
    reveal: progressive
    unlock_when: {flag: resort_intro_completed, expected: true}
    success_points: 100
    failure_points: 0
    required_flags:
      - victoria_intimate_bond_complete
      - stella_intimate_bond_complete
      - maria_intimate_bond_complete
      - luna_intimate_bond_complete
    complete_when_required_flags: true
    completion_flag: campaign_complete
    terminal_failure_flags: []
