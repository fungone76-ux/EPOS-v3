# EPOS Action Library - Adult Oriented V2
#
# Purpose:
# - The LLM chooses action_id.
# - Python validates action_id.
# - Python expands action_id into stable renderer tags.
# - Actions describe what the subject is DOING. Poses describe body arrangement.
# - No explicit sexual acts here (those belong to intimacy_library).
# - Sensual, suggestive, and provocative everyday actions are included.
#
# Final prompt layer order:
#   base_prompt + lora + outfit + pose.tags + action.tags + camera.tags + location.tags + controlled_scene_tags

schema_version: 2
world_id: resort_world
library_type: action

defaults:
  fallback_action_id: idle_neutral
  tag_separator: ", "
  strict_unknown_action: true

actions:
